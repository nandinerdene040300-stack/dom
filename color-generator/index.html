<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 03</span>
      </header>

      <div class="flex items-start justify-start pt-10 flex-col">
        <div class="w-310 h-26 flex gap-[434px]">
          <div class="w-155 h-[65px]">
            <div class="text-[#F4F4F5] text-3xl pb-3">Color palettes.</div>
            <div class="text-[#A1A1AA] text-sm pb-[39px]">Generated shades with Tailwind color names. Click a shade to copy its HEX background color.</div>
          </div>
          <button class="w-[186px] h-12 bg-[#D9F99D] flex justify-center items-center rounded-xl gap-2 text-[#09090B] active:scale-90 translate duration-300 ease-in">
            <div>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-shuffle preview-icon"
              >
                <path d="m18 14 4 4-4 4" />
                <path d="m18 2 4 4-4 4" />
                <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22" />
                <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
                <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
              </svg>
            </div>
            <div>Shuffle palettes</div>
          </button>
        </div>
        <div class="border-solid border-[#A1A1AA] w-310 border-t"></div>
        <div class="text-[#A1A1AA] text-xs flex justify-between pt-5 gap-[978px]">
          <div>100 → 950 · LIGHT TO DARK</div>
          <div>Ready to explore.</div>
        </div>
      </div>
      <div class="space-y-7 mt-5">
        <div class="">
          <h4>Red</h4>
          <div class="text-sm text-white flex gap-3">
            <div class="h-[107px] flex justify-center items-center flex-col">
              <div class="w-[113.2px] h-16 rounded-xl bg-[#FDE3E3]"></div>
              <div class="text-[#D4D4D8] text-xs">100</div>
              <div class="text-[#A1A1AA] text-[9px]">#FDE3E3</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
