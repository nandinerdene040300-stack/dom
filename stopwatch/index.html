<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]"
  >
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65"
          >The everyday collection / 04</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="w-155 bg-[#151d1a] border border-[#383f3c] rounded-3xl "
        >
          <div class="flex justify-between pr-[38px] pt-10 pl-10">
            <div
              class="size-11 rounded-xl bg-[#252e29] flex justify-center items-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="23"
                height="23"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#c5d9bd"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-timer preview-icon"
              >
                <line x1="10" x2="14" y1="2" y2="2" />
                <line x1="12" x2="15" y1="14" y2="11" />
                <circle cx="12" cy="14" r="8" />
              </svg>
            </div>
            <div
            id="state"
              class="w-[62px] h-[29px] flex justify-center items-center border border-[#364038] bg-[#252e29] rounded-xl text-[#C5D9BD] text-xs"
            >
              Ready
            </div>
          </div>
          <div class="text-[#F0FDF4] text-[40px] pt-7 pl-10">Stopwatch</div>
          <div class="text-[#A4B9AD] text-sm pt-2 pb-9 pl-10">
            Make time for what matters.
          </div>
          <div class="border-t w-[540px] border-[#2d3830] ml-10"></div>
          <div class="flex items-center gap-15 justify-center pt-9 pb-9">
            <div  class="flex flex-col items-center">
              <div id="hours" class="text-[#c5d9bd] text-[56px] w-[66px]">00</div>
              <div class="text-[#9BAD9E] text-[9px] flex">HOURS</div>
            </div>

            <span class="text-[40px] text-[#5C7161]">:</span>

            <div class="flex flex-col items-center ">
              <div id="minutes" class="text-[#c5d9bd] text-[56px] w-[66px]">00</div>
              <div class="text-[#9BAD9E] text-[9px] flex">MINUTES</div>
            </div>
            <span class="text-[40px] text-[#5C7161]">:</span>
            <div class="flex flex-col items-center">
              <div id="seconds" class="text-[#c5d9bd] text-[56px] w-[66px]">00</div>
              <div class="text-[#9BAD9E] text-[9px] flex">SECONDS</div>
            </div>
          </div>
          <div class="border-t w-[540px] border-[#2d3830] ml-10"></div>
          <div class="flex gap-3 pt-8 pl-10">
            <button
            id="start-button"
              class="translate duration-300 ease-in active:scale-90 disabled:cursor-not-allowed disabled:opacity-35 w-[258px] h-12 rounded-xl bg-[#B5CBB2] flex justify-center items-center text-[#102418] text-sm"
            >
              Start
            </button>
            <button
            id="pause-button"
              disabled
              class="translate duration-300 ease-in active:scale-90 disabled:cursor-not-allowed w-[129px] disabled:opacity-35 h-12 rounded-xl bg-[#222926] flex justify-center items-center text-[#dcece2] text-sm border border-[#222926]"
            >
              Pause
            </button>
            <button
            id="reset-button"
              disabled
              class="translate duration-300 ease-in active:scale-90 disabled:cursor-not-allowed disabled:opacity-35 w-[129px] h-12 rounded-xl bg-[#151d1a] flex justify-center items-center text-[#dcece2] text-sm border border-[#222926]"
            >
              Reset
            </button>
          </div>
          <div
            class="text-[#8AA294] text-xs flex justify-center pt-5 pb-[41px]"
          >
            A moment of focus. At your own pace.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
